[project]
name = "marqo-model-management-container"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.2",
    "fsspec>=2025.9.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "orjson>=3.11.3",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.10.1",
    "python-json-logger>=3.3.0",
    "s3fs>=2025.9.0",
    "tqdm>=4.67.1",
    "uvicorn>=0.35.0",
]

[pytest]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
