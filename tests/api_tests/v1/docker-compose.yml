services:
  # Base configurations that will be extended (not meant to be run directly)
  marqo-base:
    image: ${MARQO_DOCKER_IMAGE}
    container_name: marqo
    ports:
      - "8882:8882"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    env_file:
      - ${ENV_FILE:-.env.default}
    environment:
      # Common env vars across all profiles
      - MARQO_MODE=API
      - MARQO_API_WORKERS=4
      - MARQO_ENABLE_THROTTLING=FALSE
      - MARQO_REMOTE_INFERENCE_URL=http://inference:8881
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MARQO_ENABLE_BATCH_APIS=true
      - VESPA_CONFIG_URL=http://host.docker.internal:19071
      - VESPA_DOCUMENT_URL=http://host.docker.internal:8080
      - VESPA_QUERY_URL=http://host.docker.internal:8080
      - ZOOKEEPER_HOSTS=host.docker.internal:2181
      - MARQO_INDEX_DEPLOYMENT_LOCK_TIMEOUT=0
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - MARQO_MODELS_TO_PRELOAD=[]
#    runtime: nvidia

  inference-base:
    image: ${MARQO_DOCKER_IMAGE}
    container_name: inference
    ports:
      - "8881:8881"
    env_file:
      - ${ENV_FILE:-.env.default}
    environment:
      - MARQO_MODE=INFERENCE
      - MARQO_MODELS_TO_PRELOAD=[]
      - MARQO_INFERENCE_WORKER_COUNT=1
      - MARQO_ENABLE_THROTTLING=FALSE
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
#    runtime: nvidia

  # Default profile services
  marqo:
    extends: marqo-base
    profiles: ["default"]
    depends_on:
      - inference

  inference:
    extends: inference-base
    profiles: ["default"]

  # Local profile services
  marqo-local:
    extends: marqo-base
    profiles: ["local"]
    depends_on:
      - inference-local
    environment:
      # Local-specific settings
      - MARQO_MAX_CPU_MODEL_MEMORY=1.6

  inference-local:
    extends: inference-base
    profiles: ["local"]

  # CUDA profile services
  marqo-cuda:
    extends: marqo-base
    profiles: ["cuda"]
    network_mode: "host"
    depends_on:
      - inference-cuda

  inference-cuda:
    extends: inference-base
    profiles: ["cuda"]
    network_mode: "host"
    environment:
      - MARQO_MAX_CUDA_MODEL_MEMORY=15
      - MARQO_MAX_CPU_MODEL_MEMORY=15
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
