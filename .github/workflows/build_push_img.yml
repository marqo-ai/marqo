name: Build and Push Marqo Docker Image

permissions:
  contents: read
  id-token: write

# TODO: Add concurrency for these tasks (https://s2search.atlassian.net/browse/MQ-274) (https://github.com/marqo-ai/marqo/pull/1024#discussion_r1841652402)
on:
  workflow_call:
    inputs:
      marqo_ref:
        description: 'Marqo branch-name, commit SHA or tag'
        required: false
        type: string
        default: 'mainline'
      push_to:
        description: 'image destination. Options: "OS-ECR", "AMI-ECR"'
        required: true
        type: choice
        options:
          - OS-ECR
          - AMI-ECR
        default: OS-ECR
      image_repo_prefix:
        description: 'The prefix of the image repository, by default "marqoai". We will push 3 images: {prefix}/api, {prefix}/inference-orchestrator, {prefix}/model-management'
        required: true
        type: string
        default: 'marqoai'
      image_tag:
        description: 'Image tag'
        required: true
        type: string
    outputs:
      image_identifier:
        # By image_identifier, we refer to the
        # complete qualified image name with the image digest (i.e  424082663841.dkr.ecr.us-east-1.amazonaws.com/marqo-compatibility-tests@sha256:1234567890abcdef).      image_identifier:
        description: "The image_identifier (ex: 424082663841.dkr.ecr.us-east-1.amazonaws.com/marqo-compatibility-tests@sha256:1234567890abcdef)"
        value: ${{ jobs.Docker-Build.outputs.image_identifier }}

  workflow_dispatch: #for manual triggers
    inputs:
      marqo_ref:
        description: 'Marqo branch-name, commit SHA or tag'
        required: false
        type: string
        default: 'mainline'
      push_to:
        description: 'image destination. Options: "OS-ECR", "AMI-ECR", "Both"'
        required: true
        type: choice
        options:
          - OS-ECR
          - AMI-ECR
        default: OS-ECR
      image_repo_prefix:
        description: 'The prefix of the image repository, by default "marqoai". We will push 3 images: {prefix}/api, {prefix}/inference-orchestrator, {prefix}/model-management'
        required: true
        type: string
        default: 'marqoai'
      image_tag:
        description: 'Image tag'
        required: true
        type: string
    outputs:
      image_identifier:
        # By image_identifier, we refer to the
        # complete qualified image name with the image digest (i.e  424082663841.dkr.ecr.us-east-1.amazonaws.com/marqo-compatibility-tests@sha256:1234567890abcdef).      image_identifier:
        description: "The image_identifier (ex: 424082663841.dkr.ecr.us-east-1.amazonaws.com/marqo-compatibility-tests@sha256:1234567890abcdef)"
        value: ${{ jobs.Docker-Build.outputs.image_identifier }}

jobs:
  Docker-Build:
    name: Build docker image
    runs-on: "runs-on=${{ github.run_id }}/family=t3.xlarge/ami=${{ vars.MARQO_CPU_AMD64_TESTS_INSTANCE_AMI }}"
    outputs:
      image_identifier: ${{ steps.set-image-identifier-in-output.outputs.image_identifier }}

    steps:
      - name: Set input variables
        id: set-inputs
        run: |
          echo "MARQO_REF=${{ inputs.marqo_ref || github.event.inputs.marqo_ref }}" >> $GITHUB_ENV
          echo "PUSH_TO=${{ inputs.push_to || github.event.inputs.push_to }}" >> $GITHUB_ENV
          echo "IMAGE_REPO_PREFIX=${{ inputs.image_repo_prefix || github.event.inputs.image_repo_prefix }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ inputs.image_tag || github.event.inputs.image_tag }}" >> $GITHUB_ENV

      - name: Checkout Marqo
        uses: actions/checkout@v3
        with:
          repository: marqo-ai/marqo
          ref: ${{ env.MARQO_REF }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to ECR
        uses: docker/login-action@v2
        if: env.PUSH_TO == 'OS-ECR'
        with:
          registry: 424082663841.dkr.ecr.us-east-1.amazonaws.com
          username: ${{ secrets.ECR_PUSHER_AWS_ACCESS_KEY_ID }}
          password: ${{ secrets.ECR_PUSHER_AWS_SECRET_ACCESS_KEY }}

      - name: Set registry and image repo
        id: prepare
        run: |
          if [[ "${{ env.PUSH_TO }}" == "OS-ECR" ]]; then
            echo "registry=424082663841.dkr.ecr.us-east-1.amazonaws.com" >> $GITHUB_OUTPUT
          else
            echo "registry=marqoai" >> $GITHUB_OUTPUT
          fi

      - name: Build and push api image
        id: build-and-push-api
        uses: docker/build-push-action@v4
        with:
          context: ./components/marqo
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.prepare.outputs.registry }}/${{ env.IMAGE_REPO_PRFIX }}/api:${{ env.IMAGE_TAG }}

      - name: Build and push inference orchestrator image
        id: build-and-push-inference-orchestrator
        uses: docker/build-push-action@v4
        with:
          context: ./components/inference-orchestrator
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.prepare.outputs.registry }}/${{ env.IMAGE_REPO_PRFIX }}/inference-orchestrator:${{ env.IMAGE_TAG }}

      - name: Build and push model management image
        id: build-and-push-model-management
        uses: docker/build-push-action@v4
        with:
          context: ./components/inference-orchestrator
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.prepare.outputs.registry }}/${{ env.IMAGE_REPO_PRFIX }}/model-management:${{ env.IMAGE_TAG }}

      - name: Output image_identifier
        # By image_identifier, we refer to the complete qualified image name with the image digest (i.e 424082663841.dkr.ecr.us-east-1.amazonaws.com/marqo-compatibility-tests@sha256:1234567890abcdef)
        id: set-image-identifier-in-output
        run: |
          echo "api_image_identifier=${{ steps.prepare.outputs.registry }}/${{ env.IMAGE_REPO_PRFIX }}/api@${{ steps.build-and-push-api.outputs.digest }}" >> $GITHUB_OUTPUT
          echo "api_image_identifier=${{ steps.prepare.outputs.registry }}/${{ env.IMAGE_REPO_PRFIX }}/inference-orchestrator@${{ steps.build-and-push-inference-orchestrator.outputs.digest }}" >> $GITHUB_OUTPUT
          echo "api_image_identifier=${{ steps.prepare.outputs.registry }}/${{ env.IMAGE_REPO_PRFIX }}/model-management@${{ steps.build-and-push-model-management.outputs.digest }}" >> $GITHUB_OUTPUT
