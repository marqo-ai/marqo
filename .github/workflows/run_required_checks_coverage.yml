name: Run Coverage Checks
on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  Combine-Coverage-Reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout marqo repo
        uses: actions/checkout@v3
        with:
          path: marqo
          fetch-depth: 0

      - name: Download integration tests coverage
        uses: actions/download-artifact@v4
        with:
          name: marqo-integ-tests-report
          path: integration-tests-coverage

      - name: Download large model tests coverage
        uses: actions/download-artifact@v4
        with:
          name: marqo-largemodel-tests-report
          path: largemodel-tests-coverage

      - name: Download unit tests coverage
        uses: actions/download-artifact@v4
        with:
          name: marqo-unit-tests-report
          path: unit-tests-coverage

      - name: List downloaded artifacts
        run: |
          echo "Listing all downloaded artifacts:"
          echo "Integration tests coverage:"
          ls -la integration-tests-coverage/
          echo "Large model tests coverage:"
          ls -la largemodel-tests-coverage/
          echo "Unit tests coverage:"
          ls -la unit-tests-coverage/

      - name: Install coverage package
        run: |
          pip install coverage
          pip install diff-cover

      - name: Move coverage files
        run: |
          # Create a directory to store all coverage data
          mkdir -p coverage_data
          mkdir -p unit_coverage_data
          mkdir -p integ_coverage_data
          
          # Move all coverage files to a single directory
          cp integration-tests-coverage/.coverage coverage_data/integration.coverage || true
          cp largemodel-tests-coverage/.coverage coverage_data/largemodel.coverage || true
          cp unit-tests-coverage/.coverage coverage_data/unit.coverage || true
          
          # Copy to separate directories for individual analysis
          cp integration-tests-coverage/.coverage integ_coverage_data/integration.coverage || true
          cp largemodel-tests-coverage/.coverage integ_coverage_data/largemodel.coverage || true
          cp unit-tests-coverage/.coverage unit_coverage_data/unit.coverage || true
          
          export PYTHONPATH="../marqo"

          # Combine coverage data if available
          cd coverage_data
          ls -la
          echo "Combining coverage files..."
          coverage combine integration.coverage largemodel.coverage unit.coverage
          coverage xml -o coverage.xml
          coverage html --directory=htmlcov
          
          # Generate unit test coverage data
          cd ../unit_coverage_data
          coverage combine unit.coverage
          coverage xml -o coverage.xml
          coverage html --directory=htmlcov
          
          # Generate integration test coverage data (including largemodel)
          cd ../integ_coverage_data
          coverage combine integration.coverage largemodel.coverage
          coverage xml -o coverage.xml
          coverage html --directory=htmlcov

      - name: Install diff-cover
        run: |
          pip install diff-cover

      - name: Check diff unit test coverage (95% threshold)
        id: unit_diff_coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          cd marqo
          
          export PYTHONPATH="."
          export BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          echo "Running diff-cover against branch $BASE_BRANCH"
          git fetch origin $BASE_BRANCH:$BASE_BRANCH
          
          diff-cover ../unit_coverage_data/coverage.xml --html-report ../unit_coverage_data/diff_cov.html \
            --markdown-report ../unit_coverage_data/diff_cov.md \
            --compare-branch $BASE_BRANCH --fail-under=95

      - name: Check diff integ test coverage (80% threshold)
        id: integ_diff_coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          cd marqo
          
          export PYTHONPATH="."
          export BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          echo "Running diff-cover against branch $BASE_BRANCH"
          git fetch origin $BASE_BRANCH:$BASE_BRANCH
          
          diff-cover ../integ_coverage_data/coverage.xml --html-report ../integ_coverage_data/diff_cov.html \
            --markdown-report ../integ_coverage_data/diff_cov.md \
            --compare-branch $BASE_BRANCH --fail-under=80

      - name: Check diff combined test coverage (90% threshold)
        id: combined_diff_coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          cd marqo
          
          export PYTHONPATH="."
          export BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          echo "Running diff-cover against branch $BASE_BRANCH"
          git fetch origin $BASE_BRANCH:$BASE_BRANCH
          
          diff-cover ../coverage_data/coverage.xml --html-report ../coverage_data/diff_cov.html \
            --markdown-report ../coverage_data/diff_cov.md \
            --compare-branch $BASE_BRANCH --fail-under=90

      - name: Check overall integration test coverage (70% threshold)
        id: integ_overall_coverage
        continue-on-error: true
        run: |
          cd integ_coverage_data
          COVERAGE_PERCENT=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(float(root.attrib['line-rate']) * 100)")
          echo "percentage=$COVERAGE_PERCENT" >> $GITHUB_OUTPUT
          echo "Integration test coverage: $COVERAGE_PERCENT%"
          if (( $(echo "$COVERAGE_PERCENT < 70" | bc -l) )); then
            echo "::error::Integration test coverage is below 70%"
            exit 1
          fi

      - name: Check overall combined test coverage (75% threshold)
        id: combined_overall_coverage
        continue-on-error: true
        run: |
          cd coverage_data
          COVERAGE_PERCENT=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(float(root.attrib['line-rate']) * 100)")
          echo "percentage=$COVERAGE_PERCENT" >> $GITHUB_OUTPUT
          echo "Combined test coverage: $COVERAGE_PERCENT%"
          if (( $(echo "$COVERAGE_PERCENT < 75" | bc -l) )); then
            echo "::error::Combined test coverage is below 75%"
            exit 1
          fi

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: combined-test-coverage
          path: |
            coverage_data/coverage.xml
            coverage_data/htmlcov/
            coverage_data/diff_cov.html

      - name: Upload unit test coverage report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: |
            unit_coverage_data/coverage.xml
            unit_coverage_data/htmlcov/
            unit_coverage_data/diff_cov.html

      - name: Upload integration test coverage report
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-coverage
          path: |
            integ_coverage_data/coverage.xml
            integ_coverage_data/htmlcov/
            integ_coverage_data/diff_cov.html

      - name: Print coverage reports
        run: |
          echo "# Combined diff coverage summary" >> $GITHUB_STEP_SUMMARY
          cat coverage_data/diff_cov.md >> $GITHUB_STEP_SUMMARY

          echo "# Integ diff coverage summary" >> $GITHUB_STEP_SUMMARY
          cat integ_coverage_data/diff_cov.md >> $GITHUB_STEP_SUMMARY

          echo "# Unit diff coverage summary" >> $GITHUB_STEP_SUMMARY
          cat unit_coverage_data/diff_cov.md >> $GITHUB_STEP_SUMMARY

      - name: Fail if coverage thresholds not met
        if: github.event_name == 'pull_request' && (steps.combined_diff_coverage.outcome == 'failure' || steps.unit_diff_coverage.outcome == 'failure' || steps.integ_diff_coverage.outcome == 'failure' || steps.integ_overall_coverage.outcome == 'failure' || steps.combined_overall_coverage.outcome == 'failure')
        run: |
          echo "Coverage threshold check failed"
          if [ "${{ steps.unit_diff_coverage.outcome }}" == "failure" ]; then
            echo "❌ Unit test diff coverage: ${{ steps.unit_diff_coverage.outputs.percentage }}% (required: 95%)"
          fi
          if [ "${{ steps.integ_diff_coverage.outcome }}" == "failure" ]; then
            echo "❌ Integration test diff coverage: ${{ steps.integ_diff_coverage.outputs.percentage }}% (required: 80%)"
          fi
          if [ "${{ steps.combined_diff_coverage.outcome }}" == "failure" ]; then
            echo "❌ Combined diff coverage: ${{ steps.combined_diff_coverage.outputs.percentage }}% (required: 90%)"
          fi
          if [ "${{ steps.integ_overall_coverage.outcome }}" == "failure" ]; then
            echo "❌ Integration test coverage: ${{ steps.integ_overall_coverage.outputs.percentage }}% (required: 70%)"
          fi
          if [ "${{ steps.combined_overall_coverage.outcome }}" == "failure" ]; then
            echo "❌ Combined test coverage: ${{ steps.combined_overall_coverage.outputs.percentage }}% (required: 75%)"
          fi
          exit 1
