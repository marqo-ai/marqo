name: Large Model Integration Tests CI
# Runs integration tests on CUDA machine with large model tests.

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - mainline
      - releases/*
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - mainline
      - releases/*
    paths-ignore:
      - '**.md'

concurrency:
  group: large-model-integration-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  Test-Marqo:
    name: Run Large Model Integration Tests (Part ${{ matrix.part }}/3)
    strategy:
      fail-fast: false
      matrix:
        part: [ 0, 1, 2, 3 ] # Zero-based index for JSON list access
    runs-on: "runs-on=${{ github.run_id }}/family=g4dn.2xlarge/ami=${{ vars.MARQO_CUDA_TESTS_INSTANCE_AMI }}/part=${{ matrix.part }}/PoloRole=testing"
    
    timeout-minutes: 60

    steps:
      - name: Checkout marqo repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          path: marqo

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Checkout marqo-base for requirements
        uses: actions/checkout@v3
        with:
          repository: marqo-ai/marqo-base
          path: marqo-base

      - name: Install dependencies
        run: |
          pip install -r marqo-base/requirements/amd64-gpu-requirements.txt
          # Override base requirements with marqo requirements if needed: 
          pip install -r marqo/requirements.txt
          pip install -r marqo/requirements.dev.txt
          pip install pytest==7.4.0

      - name: Download nltk data
        run: |
          python -m nltk.downloader punkt_tab

      - name: Build Vespa
        run: |
          sudo systemctl stop unattended-upgrades
          sudo apt-get remove -y unattended-upgrades
          
          echo "Updating package list"
          sudo apt-get update -y
          
          # Build Vespa components
          echo "Installing jdk 17"
          sudo apt-get install openjdk-17-jdk -y
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          echo "Installing maven"
          sudo apt-get install maven -y
          echo "Building Vespa components"
          cd marqo/vespa
          mvn clean package

      - name: Start Vespa
        run: python marqo/scripts/vespa_local/vespa_local.py full-start --Shards ${{ inputs.number_of_shards || 1 }} --Replicas ${{ inputs.number_of_replicas || 0 }}

      - name: Run Large Model Integration Tests (Part ${{ matrix.part }})
        run: |
          # Define these for use by Marqo
          export VESPA_CONFIG_URL=http://localhost:19071
          export VESPA_DOCUMENT_URL=http://localhost:8080
          export VESPA_QUERY_URL=http://localhost:8080
          export MARQO_MAX_CPU_MODEL_MEMORY=15
          export MARQO_MAX_CUDA_MODEL_MEMORY=15
          export HF_HUB_ENABLE_HF_TRANSFER=1
          
          export PRIVATE_MODEL_TESTS_AWS_ACCESS_KEY_ID=${{ secrets.PRIVATE_MODEL_TESTS_AWS_ACCESS_KEY_ID }}
          export PRIVATE_MODEL_TESTS_AWS_SECRET_ACCESS_KEY=${{ secrets.PRIVATE_MODEL_TESTS_AWS_SECRET_ACCESS_KEY }}
          export PRIVATE_MODEL_TESTS_HF_TOKEN=${{ secrets.PRIVATE_MODEL_TESTS_HF_TOKEN }}
          
          export PYTHONPATH="./marqo/tests/integ_tests:./marqo/src"

          # Run only the assigned test partition
          pytest marqo/tests/integ_tests --largemodel --split-n 4 --split-part ${{ matrix.part }} --suppress-skips
